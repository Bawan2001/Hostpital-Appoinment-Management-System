server:
  port: 8085

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${DB_NAME:notification_db}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

springdoc:
  api-docs:
    path: /api/v1/notifications/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  api-key: ${INTERNAL_API_KEY:hospital-internal-secret-key-2026}

