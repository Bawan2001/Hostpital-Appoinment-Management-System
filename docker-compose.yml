version: '3.8'

services:
  # Databases
  mongodb:
    image: mongo:latest
    container_name: hospital-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: auth_db
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Discovery
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: hospital-eureka-server
    ports:
      - "8761:8761"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Microservices
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: hospital-auth-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=auth_db
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - hospital-network

  # Central API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hospital-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - hospital-network

  # Gateway & Auth Testing SPA Client
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: hospital-client-app
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge
