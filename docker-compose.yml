services:
  # MongoDB Database Server
  mongodb:
    image: mongo:latest
    container_name: hospital-mongodb
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: auth_db
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Netflix Eureka Service Discovery Server
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: hospital-eureka-server
    ports:
      - "8761:8761"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Microservice 1: User & Auth Service (Student 1: D.M.B. Rukmal Dissanayaka)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: hospital-auth-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=auth_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - PATIENT_SERVICE_URL=http://patient-service:8082
      - DOCTOR_SERVICE_URL=http://doctor-service:8083
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - hospital-network

  # Microservice 2: Patient Service (Student 2: H.M. Imashi Dilshani)
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: hospital-patient-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=patient_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - hospital-network

  # Microservice 3: Doctor Service (Student 3: J.W.A. Indumini Adarshya)
  doctor-service:
    build:
      context: ./doctor-service
      dockerfile: Dockerfile
    container_name: hospital-doctor-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=doctor_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - hospital-network

  # Microservice 4: Appointment Service (Student 4: G. Rashmi Dulashani)
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: hospital-appointment-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=appointment_db
      - NOTIFICATION_HOST=notification-service
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - hospital-network

  # Microservice 5: Notification Service (Student 5: T.H. Imalsha Dilshani)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: hospital-notification-service
    ports:
      - "8085:8085"
    environment:
      - EUREKA_HOST=eureka-server
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - DB_NAME=notification_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - hospital-network

  # Central API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: hospital-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_HOST=eureka-server
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-hospital-internal-secret-key-2026}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      doctor-service:
        condition: service_started
      appointment-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - hospital-network

  # Unified Single Page Application (Web Frontend)
  client-app:
    build:
      context: ./client-app
      dockerfile: Dockerfile
    container_name: hospital-client-app
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge
